name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Serve the demo at the site root, with its library import pointed at ./dist.
      # The old examples/webcodecs/ path redirects to the root.
      - name: Assemble site
        run: |
          mkdir -p _site/examples/webcodecs
          cp -r dist _site/dist
          sed "s#'../../dist/index.js'#'./dist/index.js'#" examples/webcodecs/index.html > _site/index.html
          grep -q "'./dist/index.js'" _site/index.html
          cat > _site/examples/webcodecs/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>framecode</title>
          <meta http-equiv="refresh" content="0; url=../../">
          <a href="../../">framecode WebCodecs demo</a>
          HTML
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}examples/webcodecs/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
